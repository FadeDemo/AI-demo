<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">日志与测试形成工程反馈闭环</title>
  <desc id="desc">代码运行产生行为，日志帮助观察问题，问题被修复后形成自动化测试，测试继续保护代码修改。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f67d8" />
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#25315f" flood-opacity="0.14" />
    </filter>
  </defs>
  <rect width="960" height="360" rx="28" fill="#f7f8fc" />
  <text x="480" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#202746">工程反馈闭环</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g>
      <rect x="70" y="122" width="180" height="108" rx="18" fill="#ffffff" stroke="#9aa8ef" stroke-width="2" />
      <text x="160" y="165" font-size="21" font-weight="700" fill="#28336b">代码与配置</text>
      <text x="160" y="196" font-size="15" fill="#606987">产生运行行为</text>
    </g>
    <g>
      <rect x="290" y="122" width="180" height="108" rx="18" fill="#eef1ff" stroke="#7184e4" stroke-width="2" />
      <text x="380" y="165" font-size="21" font-weight="700" fill="#28336b">日志</text>
      <text x="380" y="196" font-size="15" fill="#606987">定位运行时问题</text>
    </g>
    <g>
      <rect x="510" y="122" width="180" height="108" rx="18" fill="#fff5e8" stroke="#e1a34b" stroke-width="2" />
      <text x="600" y="165" font-size="21" font-weight="700" fill="#714514">修复与澄清</text>
      <text x="600" y="196" font-size="15" fill="#78644d">确认预期行为</text>
    </g>
    <g>
      <rect x="730" y="122" width="180" height="108" rx="18" fill="#ebf8f1" stroke="#4aa877" stroke-width="2" />
      <text x="820" y="165" font-size="21" font-weight="700" fill="#1f6946">自动化测试</text>
      <text x="820" y="196" font-size="15" fill="#527060">阻止相同回归</text>
    </g>
  </g>
  <g fill="none" stroke="#4f67d8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 176 H283" />
    <path d="M470 176 H503" />
    <path d="M690 176 H723" />
    <path d="M820 238 C820 315 160 315 160 238" />
  </g>
  <text x="480" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4d5776">测试为下一次修改提供快速反馈</text>
</svg>
