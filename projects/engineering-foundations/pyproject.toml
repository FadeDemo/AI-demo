[project]
name = "engineering-foundations"
version = "0.1.0"
description = "Runnable logging and testing examples for the engineering foundations course"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
engineering-demo = "engineering_foundations.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
