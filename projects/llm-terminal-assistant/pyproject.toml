[project]
name = "llm-terminal-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paigeman", email = "53284808+paigeman@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
]

[project.scripts]
llm-terminal-assistant = "llm_terminal_assistant.cli:main"

[project.optional-dependencies]
openai = [
    "openai>=2.53.0",
]
token-counting = [
    "transformers>=5.5.0,<6",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
