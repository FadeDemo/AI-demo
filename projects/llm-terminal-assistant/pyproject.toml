[project]
name = "llm-terminal-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "paigeman", email = "53284808+paigeman@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.25,<5", "python-dotenv>=1.2.2"]

[project.scripts]
llm-terminal-assistant = "llm_terminal_assistant.cli:main"
prompt-experiment = "llm_terminal_assistant.prompt_experiment:main"
sampling-experiment = "llm_terminal_assistant.sampling_experiment:main"
token-count = "llm_terminal_assistant.token_count_cli:main"

[project.optional-dependencies]
openai = ["openai>=2.53.0"]
token-counting = ["transformers>=4.46.3,<6"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# CJK 全角标点是正确排版而非歧义笔误，规则对中文项目误报
ignore = ["RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
